<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Jiwon — Weather</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@300;400&family=Gaegu&display=swap" rel="stylesheet" />
<style>
  /* HanziPen SC (comes with macOS) in its thin weight; Kalam Light on other computers */
  @font-face { font-family: 'HanziPenThin'; src: local('HanziPenSC-W3'), local('HanziPen SC Regular'), local('HanziPen SC'); }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #0b1a26; overflow: hidden; }
  #sky, #fx { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  .copy {
    position: fixed; inset: 0; z-index: 1; pointer-events: none;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding-bottom: 8vh; text-align: center;
    color: #fff; font-family: 'HanziPenThin', 'Kalam', cursive;
  }
  .copy h1 {
    font-weight: 300; font-size: clamp(64px, 11vw, 180px); line-height: 1; letter-spacing: 0.02em;
    text-shadow: 0 2px 30px rgba(0, 20, 40, 0.25);
    filter: url(#boil);
  }
</style>
</head>
<body>
<canvas id="sky"></canvas>
<canvas id="fx"></canvas>

<!-- line boil: the letters are 'redrawn' a few times a second, like hand-drawn animation frames -->
<svg width="0" height="0" style="position:absolute">
  <filter id="boil" x="-8%" y="-15%" width="116%" height="130%">
    <feTurbulence id="turb" type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="1" result="n" />
    <feDisplacementMap in="SourceGraphic" in2="n" scale="12" xChannelSelector="R" yChannelSelector="G" />
  </filter>
</svg>

<div class="copy">
  <h1>Hi</h1>
</div>

<script>
/* =========================================================
   Weather sky — plain 2D canvas (no WebGL), two layers:
   #sky : gradient, sun/moon, stars — redrawn only when time/weather changes
   #fx  : clouds, rain, snow, fog, lightning — animated
   Real weather for Seoul from Open-Meteo (free, no key).
   Preview: ?weather=clear|clouds|rain|storm|snow|fog  &  ?hour=0..24
   ========================================================= */
const params = new URLSearchParams(location.search);
const skyCv = document.getElementById('sky'), fxCv = document.getElementById('fx');
const sky = skyCv.getContext('2d'), fx = fxCv.getContext('2d');
let W = 0, H = 0, DPR = 1;

const LAT = 37.5665, LON = 126.978, PLACE = 'Seoul';

/* ---------- time of day ---------- */
const hourParam = parseFloat(params.get('hour'));
function currentHour() {
  if (!Number.isNaN(hourParam)) return hourParam;
  const d = new Date();
  return d.getHours() + d.getMinutes() / 60;
}
function sunElevation(h) { // up 06:30, down 19:00 (rough)
  if (h >= 6.5 && h <= 19) return 50 * Math.sin(Math.PI * (h - 6.5) / 12.5);
  return -25 * Math.sin(Math.PI * (((h - 19 + 24) % 24) / 11.5));
}

/* ---------- weather state ---------- */
// WMO weather code -> visual mix + words
function fromCode(code) {
  const s = { clouds: 0, rain: 0, snow: 0, fog: 0, storm: false, word: 'clear skies' };
  if (code === 1) Object.assign(s, { clouds: 0.25, word: 'mostly clear' });
  else if (code === 2) Object.assign(s, { clouds: 0.55, word: 'a few clouds' });
  else if (code === 3) Object.assign(s, { clouds: 0.95, word: 'cloudy' });
  else if (code === 45 || code === 48) Object.assign(s, { clouds: 0.6, fog: 1, word: 'foggy' });
  else if (code >= 51 && code <= 57) Object.assign(s, { clouds: 0.85, rain: 0.3, word: 'drizzle' });
  else if (code >= 61 && code <= 67) Object.assign(s, { clouds: 0.95, rain: code >= 65 ? 1 : 0.65, word: 'raining' });
  else if (code >= 71 && code <= 77) Object.assign(s, { clouds: 0.9, snow: code >= 75 ? 1 : 0.6, word: 'snowing' });
  else if (code >= 80 && code <= 82) Object.assign(s, { clouds: 0.85, rain: 0.8, word: 'showers' });
  else if (code === 85 || code === 86) Object.assign(s, { clouds: 0.85, snow: 0.8, word: 'snow showers' });
  else if (code >= 95) Object.assign(s, { clouds: 1, rain: 1, storm: true, word: 'thunderstorm' });
  return s;
}
const PRESET = { clear: 0, clouds: 3, rain: 63, storm: 95, snow: 73, fog: 45 };
let W8 = fromCode(0), wind = 8;

async function loadWeather() {
  const forced = params.get('weather');
  if (forced && forced in PRESET) { W8 = fromCode(PRESET[forced]); return; }
  try {
    const r = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}&current=weather_code,cloud_cover,wind_speed_10m&timezone=auto`);
    const c = (await r.json()).current;
    W8 = fromCode(c.weather_code);
    W8.clouds = Math.max(W8.clouds, c.cloud_cover / 100 * 0.9);
    wind = c.wind_speed_10m;
  } catch { /* offline: keep clear skies */ }
}

/* ---------- color helpers ---------- */
const hex = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const mix = (a, b, t) => a.map((v, i) => v + (b[i] - v) * t);
const rgb = (c, a = 1) => `rgba(${c.map(Math.round).join(',')},${a})`;
const clamp01 = (v) => Math.max(0, Math.min(1, v));
const smooth = (e0, e1, x) => { const t = clamp01((x - e0) / (e1 - e0)); return t * t * (3 - 2 * t); };

// sky palettes [top, middle, bottom]
const PAL = {
  night: ['#04060f', '#0b1226', '#1b2643'],
  dusk:  ['#27365f', '#b56a7a', '#f4b38a'],
  day:   ['#3d86d4', '#7fb6e6', '#cfe6f5'],
  gray:  ['#5d6976', '#8a96a2', '#b9c2ca'],
  grayN: ['#07090d', '#11151c', '#1d232c'],
};
let skyCols, cloudTint, light = 1, nightK = 0, sunEl = 0;

function computePalette() {
  sunEl = sunElevation(currentHour());
  const dayK = smooth(-6, 12, sunEl);                 // night -> day
  const duskK = 1 - Math.abs(clamp01((sunEl + 6) / 18) * 2 - 1); // peaks around sunrise/sunset
  nightK = 1 - smooth(-10, -2, sunEl);
  const over = clamp01((W8.clouds - 0.5) * 2 + W8.rain * 0.4 + W8.fog * 0.3); // overcast amount
  skyCols = [0, 1, 2].map((i) => {
    let c = mix(hex(PAL.night[i]), hex(PAL.day[i]), dayK);
    c = mix(c, hex(PAL.dusk[i]), duskK * 0.75 * (1 - over));
    const gray = mix(hex(PAL.grayN[i]), hex(PAL.gray[i]), dayK);
    c = mix(c, gray, over * 0.85);
    if (W8.storm) c = c.map((v) => v * 0.7);
    return c;
  });
  light = dayK;
  // clouds: white by day, warm at dusk, dark gray in bad weather, blue-gray at night
  let tint = mix([30, 36, 50], [255, 255, 255], dayK);
  tint = mix(tint, [255, 205, 185], duskK * 0.6 * (1 - over));
  tint = mix(tint, mix([22, 25, 32], [120, 128, 138], dayK), clamp01(over * 0.6 + W8.rain * 0.4));
  cloudTint = tint;
}

/* ---------- sky layer (static) ---------- */
let starField = [];
function makeStars() {
  starField = Array.from({ length: Math.round(W * H / 2600) }, () => ({
    x: Math.random() * W, y: Math.pow(Math.random(), 1.4) * H * 0.8,
    r: Math.random() < 0.07 ? 1.3 + Math.random() : 0.4 + Math.random() * 0.7,
    a: 0.35 + Math.random() * 0.65, tw: Math.random() < 0.18, ph: Math.random() * 6.28,
  }));
}
function drawSky() {
  const g = sky.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, rgb(skyCols[0])); g.addColorStop(0.55, rgb(skyCols[1])); g.addColorStop(1, rgb(skyCols[2]));
  sky.fillStyle = g; sky.fillRect(0, 0, W, H);

  const clearness = 1 - clamp01((W8.clouds - 0.4) * 1.6);
  // stars (non-twinkling ones live here; twinkling ones are animated on the fx layer)
  const starA = nightK * clearness;
  if (starA > 0.01) {
    sky.fillStyle = '#fff';
    for (const s of starField) if (!s.tw) {
      sky.globalAlpha = s.a * starA;
      sky.beginPath(); sky.arc(s.x, s.y, s.r, 0, 6.283); sky.fill();
    }
    sky.globalAlpha = 1;
  }
  // sun or moon with a soft glow
  const body = sunEl > -3
    ? { x: W * 0.74, y: H * (0.72 - clamp01(sunEl / 50) * 0.55), r: Math.min(W, H) * 0.045, col: sunEl < 10 ? [255, 214, 160] : [255, 248, 228], glow: 0.55 }
    : { x: W * 0.78, y: H * 0.2, r: Math.min(W, H) * 0.03, col: [244, 240, 226], glow: 0.25 };
  const vis = clearness * (sunEl > -3 ? smooth(-3, 2, sunEl) : nightK);
  if (vis > 0.01) {
    const gl = sky.createRadialGradient(body.x, body.y, 0, body.x, body.y, body.r * 9);
    gl.addColorStop(0, rgb(body.col, body.glow * vis)); gl.addColorStop(1, rgb(body.col, 0));
    sky.fillStyle = gl; sky.fillRect(0, 0, W, H);
    sky.fillStyle = rgb(body.col, vis);
    sky.beginPath(); sky.arc(body.x, body.y, body.r, 0, 6.283); sky.fill();
  }
}

/* ---------- cloud sprites (pre-rendered once per palette) ---------- */
let cloudSprites = [], clouds = [];
function makeCloudSprite(w, h, tint) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d');
  const puffs = 14 + Math.floor(Math.random() * 8);
  for (let i = 0; i < puffs; i++) {
    const px = w * (0.15 + Math.random() * 0.7);
    const py = h * (0.45 + (Math.random() - 0.5) * 0.35) + Math.abs(px - w / 2) / w * h * 0.25;
    const pr = h * (0.18 + Math.random() * 0.24);
    const rg = g.createRadialGradient(px, py, 0, px, py, pr);
    rg.addColorStop(0, rgb(tint, 0.55)); rg.addColorStop(0.6, rgb(tint, 0.25)); rg.addColorStop(1, rgb(tint, 0));
    g.fillStyle = rg; g.beginPath(); g.arc(px, py, pr, 0, 6.283); g.fill();
  }
  // shade the underside a little
  g.globalCompositeOperation = 'source-atop';
  const sh = g.createLinearGradient(0, h * 0.35, 0, h);
  sh.addColorStop(0, 'rgba(0,0,0,0)'); sh.addColorStop(1, 'rgba(20,25,40,0.22)');
  g.fillStyle = sh; g.fillRect(0, 0, w, h);
  return c;
}
function buildClouds() {
  cloudSprites = Array.from({ length: 6 }, () => makeCloudSprite(640, 300, cloudTint));
  const n = W8.clouds < 0.08 ? 0 : Math.round(3 + W8.clouds * 16);
  clouds = Array.from({ length: n }, (_, i) => {
    const depth = Math.random();                                 // 0 far .. 1 near
    const s = (0.45 + depth * 0.9) * Math.max(W, 900) / 1100;
    return {
      img: cloudSprites[i % cloudSprites.length], depth,
      x: Math.random() * (W + 800) - 400, y: H * (0.02 + Math.pow(Math.random(), 1.3) * 0.5) - 80 * s,
      w: 640 * s, h: 300 * s, a: 0.5 + depth * 0.5,
      v: (4 + depth * 14) * (0.5 + wind / 20),
    };
  }).sort((a, b) => a.depth - b.depth);
}

/* ---------- precipitation ---------- */
let drops = [], flakes = [];
function buildPrecip() {
  drops = Array.from({ length: Math.round(W8.rain * W * H / 2600) }, () => ({
    x: Math.random() * W, y: Math.random() * H, l: 10 + Math.random() * 18, v: 900 + Math.random() * 600,
  }));
  flakes = Array.from({ length: Math.round(W8.snow * W * H / 5000) }, () => ({
    x: Math.random() * W, y: Math.random() * H, r: 1 + Math.random() * 2.6,
    v: 30 + Math.random() * 60, ph: Math.random() * 6.28,
  }));
}

/* ---------- fog band ---------- */
let fogImg = null;
function buildFog() {
  if (!W8.fog) { fogImg = null; return; }
  fogImg = document.createElement('canvas'); fogImg.width = 1024; fogImg.height = 256;
  const g = fogImg.getContext('2d');
  const c = mix([40, 45, 55], [225, 230, 235], light);
  for (let i = 0; i < 26; i++) {
    const x = Math.random() * 1024, y = 128 + (Math.random() - 0.5) * 120, r = 60 + Math.random() * 120;
    const rg = g.createRadialGradient(x, y, 0, x, y, r);
    rg.addColorStop(0, rgb(c, 0.35)); rg.addColorStop(1, rgb(c, 0));
    g.fillStyle = rg; g.fillRect(0, 0, 1024, 256);
  }
}

/* ---------- setup / resize ---------- */
function resize() {
  DPR = Math.min(devicePixelRatio, 1.5);
  W = innerWidth; H = innerHeight;
  for (const [cv, c] of [[skyCv, sky], [fxCv, fx]]) {
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    c.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  makeStars();
  rebuild();
}
function rebuild() {
  computePalette();
  drawSky();
  buildClouds();
  buildPrecip();
  buildFog();
}

/* ---------- animation ---------- */
let last = performance.now(), flash = 0, nextFlash = 4;
function frame(now) {
  const dt = Math.min((now - last) / 1000, 0.05); last = now;
  const t = now / 1000;
  fx.clearRect(0, 0, W, H);

  // twinkling stars
  const clearness = 1 - clamp01((W8.clouds - 0.4) * 1.6);
  if (nightK * clearness > 0.01) {
    fx.fillStyle = '#fff';
    for (const s of starField) if (s.tw) {
      fx.globalAlpha = s.a * nightK * clearness * (0.45 + 0.55 * Math.sin(t * 2 + s.ph) ** 2);
      fx.beginPath(); fx.arc(s.x, s.y, s.r, 0, 6.283); fx.fill();
    }
    fx.globalAlpha = 1;
  }

  // clouds drift with the wind
  for (const c of clouds) {
    c.x += c.v * dt;
    if (c.x > W + 50) { c.x = -c.w - Math.random() * 300; }
    fx.globalAlpha = c.a;
    fx.drawImage(c.img, c.x, c.y, c.w, c.h);
  }
  fx.globalAlpha = 1;

  // fog drifting low
  if (fogImg) {
    const off = (t * 12) % W;
    fx.globalAlpha = 0.9;
    for (let k = -1; k <= 1; k++) fx.drawImage(fogImg, k * W + off, H * 0.45, W, H * 0.6);
    fx.globalAlpha = 1;
  }

  // rain: one batched path
  if (drops.length) {
    const slant = 0.12 + wind / 200;
    fx.strokeStyle = light > 0.4 ? 'rgba(235,242,250,0.45)' : 'rgba(170,185,210,0.35)';
    fx.lineWidth = 1.1;
    fx.beginPath();
    for (const d of drops) {
      d.y += d.v * dt; d.x += d.v * slant * dt;
      if (d.y > H) { d.y = -d.l; d.x = Math.random() * (W + 200) - 200; }
      fx.moveTo(d.x, d.y); fx.lineTo(d.x - d.l * slant, d.y - d.l);
    }
    fx.stroke();
  }

  // snow
  if (flakes.length) {
    fx.fillStyle = 'rgba(255,255,255,0.85)';
    fx.beginPath();
    for (const f of flakes) {
      f.y += f.v * dt; f.x += Math.sin(t * 0.8 + f.ph) * 20 * dt + wind * 0.6 * dt;
      if (f.y > H + 5) { f.y = -5; f.x = Math.random() * W; }
      if (f.x > W + 5) f.x = -5;
      fx.moveTo(f.x + f.r, f.y); fx.arc(f.x, f.y, f.r, 0, 6.283);
    }
    fx.fill();
  }

  // lightning
  if (W8.storm) {
    nextFlash -= dt;
    if (nextFlash <= 0) { flash = 1; nextFlash = 5 + Math.random() * 9; }
    if (flash > 0) {
      fx.fillStyle = `rgba(230,235,255,${flash * 0.55 * (Math.random() < 0.3 ? 0.4 : 1)})`;
      fx.fillRect(0, 0, W, H);
      flash = Math.max(0, flash - dt * 2.5);
    }
  }

  // line boil: step through a few noise frames (~8 per second), no smooth motion in between
  const boilFrame = Math.floor(t * 8) % BOIL_SEEDS.length;
  if (boilFrame !== lastBoil) { lastBoil = boilFrame; turb.setAttribute('seed', BOIL_SEEDS[boilFrame]); }

  requestAnimationFrame(frame);
}
const turb = document.getElementById('turb');
const BOIL_SEEDS = [1, 7, 13, 21];
let lastBoil = -1;

let resizeTimer;
addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(resize, 150); });

(async () => {
  resize();                       // draw right away (time of day, clear sky)
  await loadWeather();
  rebuild();                      // then with the real weather
  requestAnimationFrame(frame);
  setInterval(async () => { await loadWeather(); rebuild(); }, 15 * 60 * 1000);
  setInterval(() => { computePalette(); drawSky(); }, 60 * 1000);
})();
</script>
</body>
</html>
